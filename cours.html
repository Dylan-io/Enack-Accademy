<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catalogue complet des cours de physique — Mécanique, Thermodynamique, Électricité, Optique et Physique Quantique. Enack Academy.">
  <meta name="theme-color" content="#0c1125">
  <title>Cours — Enack Academy</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <nav class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <div class="navbar__logo-icon">⚛️</div>
        <div class="navbar__logo-text">Enack <span>Academy</span></div>
      </a>

      <div class="navbar__links" id="nav-links">
        <a href="index.html" class="navbar__link">Accueil</a>
        <a href="cours.html" class="navbar__link navbar__link--active">Cours</a>
      </div>

      <div class="navbar__actions">
        <div class="navbar__progress-mini">
          <span>📊</span>
          <div class="progress-bar">
            <div class="progress-bar__fill navbar__progress-fill" style="width: 0%"></div>
          </div>
          <span class="navbar__progress-text">0%</span>
        </div>
        <div class="navbar__burger" id="nav-burger">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </nav>

  <!-- ═══════════ CATALOG ═══════════ -->
  <section class="catalog">
    <div class="container">

      <div class="catalog__header">
        <span class="section-label">📚 Catalogue des cours</span>
        <h1 class="section-title">Tous les cours de physique</h1>
        <p class="section-subtitle">
          Sélectionnez un chapitre pour accéder au cours détaillé et aux exercices interactifs.
        </p>
      </div>

      <!-- Filters -->
      <div class="catalog__filters" id="catalog-filters">
        <button class="catalog__filter catalog__filter--active" data-filter="all">Tous</button>
        <!-- Populated by JS -->
      </div>

      <!-- Chapters by domain -->
      <div id="catalog-content">
        <!-- Populated by JS -->
      </div>

    </div>
  </section>

  <!-- ═══════════ FOOTER ═══════════ -->
  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <div class="footer__copy">
          © 2026 Enack Academy — Contenu basé sur <a href="https://openstax.org" target="_blank" rel="noopener">OpenStax</a>.
        </div>
        <div class="footer__links">
          <a href="index.html" class="footer__link">Accueil</a>
          <a href="cours.html" class="footer__link">Cours</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/js/courseData.js"></script>
  <script src="assets/js/progress.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const filtersContainer = document.getElementById('catalog-filters');
      const contentContainer = document.getElementById('catalog-content');
      if (!filtersContainer || !contentContainer) return;

      const domains = CourseData.getDomains();

      // Build filter buttons
      domains.forEach(domain => {
        const btn = document.createElement('button');
        btn.className = 'catalog__filter';
        btn.dataset.filter = domain.id;
        btn.textContent = `${domain.icon} ${domain.title}`;
        filtersContainer.appendChild(btn);
      });

      // Build domain sections
      domains.forEach(domain => {
        const section = document.createElement('div');
        section.className = 'catalog__domain-section';
        section.dataset.domain = domain.id;

        const domainColor = domain.color;
        const iconBg = `${domainColor}15`;
        const iconBorder = `${domainColor}30`;

        section.innerHTML = `
          <div class="catalog__domain-title">
            <div class="catalog__domain-icon" style="background: ${iconBg}; border: 1px solid ${iconBorder};">
              ${domain.icon}
            </div>
            <span>${domain.title}</span>
            <span style="margin-left: auto; font-size: var(--fs-sm); color: var(--clr-text-muted); font-weight: var(--fw-regular);">
              ${domain.chapters.length} chapitres
            </span>
          </div>
          <div class="catalog__chapters">
            ${domain.chapters.map((ch, index) => {
              const status = Progress.getChapterStatus(ch.id);
              let statusClass = 'chapter-card__status--new';
              let statusContent = '';
              if (status === 'done') { statusClass = 'chapter-card__status--done'; statusContent = '✓'; }
              else if (status === 'partial') { statusClass = 'chapter-card__status--partial'; statusContent = '◐'; }

              const quizScore = Progress.getQuizScore(ch.id);
              const scoreText = quizScore ? `Score: ${quizScore.percentage}%` : '';

              return `
                <a href="chapitre.html?id=${ch.id}" class="chapter-card" data-chapter="${ch.id}">
                  <div class="chapter-card__number" style="color: ${domainColor}20;">${String(index + 1).padStart(2, '0')}</div>
                  <div class="chapter-card__body">
                    <div class="chapter-card__title">${ch.title}</div>
                    <div class="chapter-card__desc">${ch.description}</div>
                    <div class="chapter-card__tags">
                      ${ch.tags.map(tag => `
                        <span class="chapter-card__tag" style="background: ${domainColor}15; color: ${domainColor}; border: 1px solid ${domainColor}25;">
                          ${tag}
                        </span>
                      `).join('')}
                    </div>
                    ${scoreText ? `<div style="margin-top: var(--sp-2); font-size: var(--fs-xs); color: var(--clr-text-muted);">${scoreText}</div>` : ''}
                  </div>
                  <div class="chapter-card__status ${statusClass}">${statusContent}</div>
                </a>
              `;
            }).join('')}
          </div>
        `;

        contentContainer.appendChild(section);
      });

      // Re-init filters
      Navigation.init();

      // Handle hash scroll
      if (window.location.hash) {
        const targetDomain = window.location.hash.substring(1);
        const section = document.querySelector(`[data-domain="${targetDomain}"]`);
        if (section) {
          setTimeout(() => {
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 300);
        }
      }
    });
  </script>

</body>
</html>
